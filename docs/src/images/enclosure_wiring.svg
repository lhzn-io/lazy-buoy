<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>lazy-buoy enclosure: power and signal wiring (as built, 2026-10-08)</title>
  <defs>
    <style>
      .box { stroke: #333; stroke-width: 1.4; rx: 6; }
      .pwr { stroke: #c62828; stroke-width: 3; fill: none; }
      .bench { stroke: #c62828; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .data { stroke: #1565c0; stroke-width: 2; fill: none; }
      .rf { stroke: #6a1b9a; stroke-width: 2.5; fill: none; }
      .t { fill: #111; text-anchor: middle; }
      .h { font-weight: bold; }
      .s { font-size: 11px; fill: #444; }
      .fuse { stroke: #333; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="790" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" class="h">lazy-buoy enclosure: power and signal wiring (as built, 2026-10-08)</text>

  <!-- legend -->
  <g transform="translate(640,18)" font-size="11">
    <line x1="0" y1="8" x2="26" y2="8" class="pwr"/><text x="32" y="12">DC positive</text>
    <line x1="110" y1="8" x2="136" y2="8" class="data"/><text x="142" y="12">USB / bus</text>
    <line x1="210" y1="8" x2="236" y2="8" class="rf"/><text x="242" y="12">RF coax</text>
    <line x1="0" y1="26" x2="26" y2="26" class="bench"/><text x="32" y="30">bench alternative (either-or)</text>
  </g>

  <!-- solar path -->
  <rect class="box" x="20" y="60" width="170" height="64" fill="#fff8e1"/>
  <text class="t h" x="105" y="84">Solar panel</text>
  <text class="t" x="105" y="101">Newpowa 30 W, 12 V</text>
  <text class="t s" x="105" y="116">100 W panel on order</text>

  <rect class="box" x="225" y="72" width="110" height="40" fill="#eeeeee"/>
  <text class="t" x="280" y="89">GX16 2-pin</text>
  <text class="t s" x="280" y="104">case bulkhead</text>

  <rect class="fuse" x="360" y="80" width="56" height="24" rx="4" fill="#ffb74d"/>
  <text class="t" x="388" y="97" font-size="12">F1 5 A</text>
  <text class="t s" x="392" y="72">18-20 AWG</text>

  <line class="pwr" x1="190" y1="92" x2="225" y2="92"/>
  <line class="pwr" x1="335" y1="92" x2="360" y2="92"/>
  <line class="pwr" x1="416" y1="92" x2="450" y2="92"/>

  <!-- charge controller -->
  <rect class="box" x="450" y="50" width="220" height="170" fill="#e3f2fd"/>
  <text class="t h" x="560" y="122">Victron BlueSolar</text>
  <text class="t h" x="560" y="140">MPPT 75/15</text>
  <text class="t s" x="560" y="158">load output: user-defined mode</text>
  <text x="458" y="96" font-size="12">PV</text>
  <text x="662" y="96" font-size="12" text-anchor="end">LOAD</text>
  <text x="662" y="190" font-size="12" text-anchor="end">VE.Direct</text>
  <text class="t" x="560" y="212" font-size="12">BATT</text>

  <!-- battery -->
  <line class="pwr" x1="560" y1="220" x2="560" y2="248"/>
  <rect class="fuse" x="530" y="248" width="60" height="24" rx="4" fill="#64b5f6"/>
  <text class="t" x="560" y="265" font-size="12">F2 15 A</text>
  <line class="pwr" x1="560" y1="272" x2="560" y2="300"/>
  <rect class="box" x="450" y="300" width="220" height="64" fill="#e8f5e9"/>
  <text class="t h" x="560" y="325">GoldenMate LiFePO4</text>
  <text class="t" x="560" y="344">12.8 V, 16 Ah (06/2025)</text>

  <!-- load path -->
  <line class="pwr" x1="670" y1="92" x2="690" y2="92"/>
  <rect class="fuse" x="690" y="80" width="56" height="24" rx="4" fill="#ffb74d"/>
  <text class="t" x="718" y="97" font-size="12">F3 5 A</text>
  <line class="pwr" x1="746" y1="92" x2="780" y2="92"/>
  <rect class="box" x="780" y="60" width="200" height="64" fill="#fff3e0"/>
  <text class="t h" x="880" y="83">Klunoxj buck converter</text>
  <text class="t" x="880" y="100">12 V to 5 V, 5 A, USB-C out</text>
  <text class="t s" x="880" y="115">no USB-PD: Pi reports 900 mA</text>
  <line class="pwr" x1="880" y1="124" x2="880" y2="250"/>
  <text x="888" y="190" font-size="12">USB-C 5 V</text>

  <!-- bench supply -->
  <rect class="box" x="710" y="150" width="150" height="50" fill="#fafafa" stroke-dasharray="5 4"/>
  <text class="t" x="785" y="171">USB-C wall supply</text>
  <text class="t s" x="785" y="187">bench only, either-or</text>
  <line class="bench" x1="785" y1="200" x2="785" y2="250"/>

  <!-- Pi -->
  <rect class="box" x="740" y="250" width="240" height="120" fill="#e0f2f1"/>
  <text class="t h" x="860" y="280">Raspberry Pi 5</text>
  <text class="t" x="860" y="299">AI HAT+ 13 TOPS (Hailo-8L, PCIe)</text>
  <text class="t s" x="860" y="320">services: sensor, VHF transcriber,</text>
  <text class="t s" x="860" y="335">NTRIP, web dashboard</text>
  <text class="t s" x="860" y="355">RTC (no backup cell)</text>

  <!-- peripheral bus -->
  <line class="data" x1="860" y1="370" x2="860" y2="410"/>
  <line class="data" x1="105" y1="410" x2="880" y2="410"/>
  <text x="112" y="404" font-size="11" fill="#1565c0">Pi USB, GPIO SPI, I2C</text>

  <line class="data" x1="105" y1="410" x2="105" y2="440"/>
  <rect class="box" x="20" y="440" width="170" height="56" fill="#ede7f6"/>
  <text class="t h" x="105" y="463">RTL-SDR Blog V4</text>
  <text class="t s" x="105" y="481">Pi USB, rtl_airband</text>

  <line class="data" x1="290" y1="410" x2="290" y2="440"/>
  <rect class="box" x="215" y="440" width="150" height="56" fill="#f5f5f5"/>
  <text class="t h" x="290" y="463">USB hub</text>
  <text class="t s" x="290" y="481">powered from Pi</text>
  <line class="data" x1="290" y1="496" x2="290" y2="530"/>
  <rect class="box" x="215" y="530" width="150" height="56" fill="#ede7f6"/>
  <text class="t h" x="290" y="553">u-blox ZED-F9P</text>
  <text class="t s" x="290" y="571">RTK, RTCM via NTRIP</text>

  <line class="data" x1="475" y1="410" x2="475" y2="440"/>
  <rect class="box" x="390" y="440" width="170" height="56" fill="#f5f5f5"/>
  <text class="t h" x="475" y="463">VE.Direct USB cable</text>
  <text class="t s" x="475" y="481">telemetry + HEX control</text>
  <polyline class="data" points="560,468 690,468 690,186 670,186"/>

  <line class="data" x1="670" y1="410" x2="670" y2="530"/>
  <rect class="box" x="585" y="530" width="170" height="56" fill="#f5f5f5"/>
  <text class="t h" x="670" y="553">I2C (STEMMA QT)</text>
  <text class="t s" x="670" y="571">BNO08x IMU, HTU31D T/RH</text>

  <line class="data" x1="880" y1="410" x2="880" y2="440"/>
  <rect class="box" x="780" y="440" width="200" height="56" fill="#ede7f6"/>
  <text class="t h" x="880" y="463">RFM9x LoRa</text>
  <text class="t s" x="880" y="481">GPIO SPI, 902.5 MHz, 23 dBm</text>

  <!-- antennas via SMA bulkheads -->
  <line class="rf" x1="105" y1="496" x2="105" y2="620"/>
  <rect class="box" x="20" y="620" width="170" height="44" fill="#fce4ec"/>
  <text class="t" x="105" y="639">SMA bulkhead</text>
  <text class="t s" x="105" y="655">marine VHF / AIS antenna</text>

  <line class="rf" x1="290" y1="586" x2="290" y2="620"/>
  <rect class="box" x="215" y="620" width="150" height="44" fill="#fce4ec"/>
  <text class="t" x="290" y="639">SMA bulkhead</text>
  <text class="t s" x="290" y="655">GNSS puck</text>

  <line class="rf" x1="880" y1="496" x2="880" y2="620"/>
  <rect class="box" x="780" y="620" width="200" height="44" fill="#fce4ec"/>
  <text class="t" x="880" y="639">SMA bulkhead</text>
  <text class="t s" x="880" y="655">915 MHz LoRa antenna</text>

  <!-- notes -->
  <rect x="20" y="690" width="960" height="88" rx="6" fill="#fafafa" stroke="#999"/>
  <text x="32" y="712" class="h" font-size="12">Power management (sensor daemon)</text>
  <text x="32" y="730" font-size="12">Below 12.0 V for 3 readings: sync, arm RTC wake, raise the MPPT load-disconnect level, halt; the MPPT then removes Pi power.</text>
  <text x="32" y="747" font-size="12">MPPT load output reconnects above 13.2 V (solar charging) and the Pi boots. Running backstop: load disconnect at 11.6 V.</text>
  <text x="32" y="767" class="s">Negative returns not drawn. F1 to F3 are blade fuses on the positive leg. The PV path (F1, wire, GX16) is sized for 30 W and must be upgraded for 100 W.</text>
</svg>
